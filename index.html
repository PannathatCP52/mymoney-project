<body class="dark-theme"> <div id="loginSection" class="login-overlay">
        <div class="login-card">
            <h2>Welcome to Wealth AI</h2>
            <input type="text" id="username" placeholder="ใส่ชื่อผู้ใช้...">
            <button onclick="login()" class="btn-primary">เข้าสู่ระบบ</button>
        </div>
    </div>

    <div class="app-container" id="dashboardSection" style="display:none;">
        <aside class="sidebar">
            <div class="logo">WEALTH AI</div>
            <nav>
                <div class="nav-item active" onclick="showTab('home')"><i class="fas fa-home"></i> Home</div>
                <div class="nav-item" onclick="showTab('analytic')"><i class="fas fa-chart-line"></i> Analytic</div>
                <div class="nav-item" onclick="toggleTheme()"><i class="fas fa-moon"></i> Dark/Light</div>
            </nav>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </aside>

        <main class="main-content">
            <div id="homeTab">
                <section class="hero-section">
                    <div class="net-worth-card">
                        <div class="card-info">
                            <h3>Total Net Worth</h3>
                            <h1 id="netWorthTHB">0 THB</h1>
                            <p id="netWorthUSD">$0.00</p>
                        </div>
                        <div class="gold-live-box">
                            <p>ทองคำแท่ง (ขาย): <span id="goldSellLabel" class="text-gold">--</span></p>
                            <p>ทองคำแท่ง (ซื้อ): <span id="goldBuyLabel" class="text-gold">--</span></p>
                        </div>
                    </div>
                </section>
                
                <div class="dashboard-grid">
                    <div class="grid-item">
                        <h3><i class="fas fa-exchange-alt"></i> Exchange Rates (Real-time)</h3>
                        <table class="exchange-table">
                            <thead><tr><th>คู่เงิน</th><th>ราคา (THB)</th></tr></thead>
                            <tbody id="exchangeBody"></tbody>
                        </table>
                    </div>
                    <div class="grid-item">
                        <canvas id="assetBarChart" style="height:250px;"></canvas>
                    </div>
                </div>
            </div>

            <div id="analyticTab" style="display:none;">
                <div class="grid-item">
                    <h3>Wealth Analysis</h3>
                    <canvas id="netWorthChart"></canvas>
                </div>
            </div>
        </main>
    </div>
</body>
