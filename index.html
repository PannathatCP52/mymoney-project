<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div class="container wide-layout">
    <section class="asset-card-wide">
        <div class="main-wealth">
            <h3>มูลค่าสินทรัพย์สุทธิ (Net Worth)</h3>
            <h1 id="netWorthTHB">0 THB</h1>
            <h2 id="netWorthUSD">$0.00</h2>
        </div>
        <div class="gold-details-grid">
            <div class="gold-item">
                <i class="fas fa-coins text-gold"></i>
                <span>ทองคำแท่ง (ขายออก):</span>
                <strong id="goldSellLabel">รอข้อมูล...</strong>
            </div>
            <div class="gold-item">
                <i class="fas fa-hand-holding-dollar"></i>
                <span>ทองคำแท่ง (รับซื้อ):</span>
                <strong id="goldBuyLabel">รอข้อมูล...</strong>
            </div>
        </div>
    </section>

    <div class="dashboard-grid">
        <div class="control-panel">
            </div>

        <div class="display-panel">
            <div class="card exchange-card">
                <h3><i class="fas fa-globe"></i> อัตราแลกเปลี่ยน Real-time</h3>
                <p class="update-time">อัปเดตล่าสุด: <span id="lastUpdate">...</span></p>
                <div class="table-responsive">
                    <table class="exchange-table">
                        <thead>
                            <tr>
                                <th>คู่เงิน</th>
                                <th>ราคา (THB)</th>
                                <th>เปลี่ยนแปลง</th>
                            </tr>
                        </thead>
                        <tbody id="exchangeBody">
                            </tbody>
                    </table>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="assetBarChart"></canvas>
            </div>
        </div>
    </div>
</div>
